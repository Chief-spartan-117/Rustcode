[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/presentation",
    "apps/rustcode",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gpui = "0.2.2"
ropey = { version = "1.6", default-features = false, features = ["simd", "cr_lines"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
json5 = "1"
regex = "1"
fancy-regex = "0.14"
unicode-segmentation = "1"
plist = "1"
notify = "8"
ignore = "0.4"
trash = "5"
serde_json = "1"
dirs = "6"
portable-pty = "0.9"
alacritty_terminal = "0.26"
git2 = { version = "0.20", default-features = false }
grep-regex = "0.1"
grep-searcher = "0.1"
irosashi = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }

rustcode-domain = { path = "crates/domain" }
rustcode-application = { path = "crates/application" }
rustcode-infrastructure = { path = "crates/infrastructure" }
rustcode-presentation = { path = "crates/presentation" }

[profile.dev]
opt-level = 1
